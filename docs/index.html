<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECIDE</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0B0E14;
    --card: #12151C;
    --border: #1C2029;
    --blue: #2F6FEB;
    --text: #F5F6F8;
    --text-muted: #9298A3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .icon {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }
  .tagline {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 32px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
  }
  .btn-primary {
    background: var(--blue);
    color: #fff;
  }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .note {
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.6;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="DECIDE">
    <h1>DECIDE</h1>
    <p class="tagline">Tu red de decisiones</p>

    <a class="btn btn-primary" href="https://github.com/rusitogar/decide-app/releases/latest/download/app-release.apk">
      Descargar APK (Android)
    </a>
    <a class="btn btn-secondary" href="https://decide-app-rusito.web.app">
      Probar en el navegador
    </a>

    <p class="note">
      Después de descargar el APK, tu teléfono puede pedirte permiso para
      "instalar apps de orígenes desconocidos" — es normal, aceptalo para
      poder instalarla (todavía no está en Google Play).
    </p>
  </div>
</body>
</html>
